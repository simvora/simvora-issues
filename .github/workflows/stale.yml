name: Close unanswered issues

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@v10
        with:
          only-labels: needs-info
          days-before-issue-stale: 7
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          remove-stale-when-updated: true
          stale-issue-message: >
            We're still waiting on the information we asked for. This issue will close in 7 days without a reply.
          close-issue-message: >
            Closing because we didn't hear back. If you can still reproduce it, reply with the details and we'll reopen it.
