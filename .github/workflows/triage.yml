name: Triage labels

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  reporter-replied:
    # When the reporter answers a needs-info question, put the issue back in the triage queue.
    if: >
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.event.issue.user.login &&
      contains(github.event.issue.labels.*.name, 'needs-info')
    runs-on: ubuntu-24.04
    steps:
      - run: gh issue edit "$NUMBER" -R "$REPO" --remove-label needs-info --add-label needs-triage
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
